<title>.NET Interview Mastery</title>
<style>
:root{
  --bg:#f4f6fb;--panel:#ffffff;--panel2:#f8fafc;--text:#1a202c;--muted:#64748b;
  --border:#e2e8f0;--accent:#6366f1;--accent2:#8b5cf6;--good:#10b981;--warn:#f59e0b;
  --bad:#ef4444;--info:#0ea5e9;--code-bg:#1e293b;--code-text:#e2e8f0;--shadow:0 4px 20px rgba(0,0,0,.06);
  --tag-bg:#eef2ff;--tag-text:#4338ca;
}
[data-theme="dark"]{
  --bg:#0f172a;--panel:#1e293b;--panel2:#172033;--text:#e2e8f0;--muted:#94a3b8;
  --border:#334155;--accent:#818cf8;--accent2:#a78bfa;--good:#34d399;--warn:#fbbf24;
  --bad:#f87171;--info:#38bdf8;--code-bg:#0b1120;--code-text:#e2e8f0;--shadow:0 4px 24px rgba(0,0,0,.4);
  --tag-bg:#312e81;--tag-text:#c7d2fe;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
/* Header */
header{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.header-inner{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.logo{font-size:1.3rem;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.logo span{font-size:.7rem;display:block;color:var(--muted);-webkit-text-fill-color:var(--muted);font-weight:500}
.hprogress{flex:1;min-width:180px;max-width:360px}
.hprogress .bar{height:8px;background:var(--border);border-radius:20px;overflow:hidden}
.hprogress .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:20px;transition:width .5s}
.hprogress .lbl{font-size:.72rem;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);font-size:.9rem}
.search-box::before{content:"🔍";position:absolute;left:10px;top:8px;opacity:.5}
.hbtns{display:flex;gap:8px}
.btn{padding:8px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer;font-size:.85rem;font-weight:600;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:5px 10px;font-size:.78rem}
/* Layout */
.layout{display:flex;max-width:1600px;margin:0 auto}
.sidebar{width:240px;flex-shrink:0;padding:16px 12px;height:calc(100vh - 66px);overflow-y:auto;position:sticky;top:66px;border-right:1px solid var(--border)}
.sidebar h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 8px 6px}
.nav-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:.86rem;margin-bottom:2px;transition:.15s}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item .cnt{font-size:.7rem;background:var(--border);padding:1px 7px;border-radius:10px;color:var(--muted)}
.nav-item.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.main{flex:1;padding:20px;min-width:0}
/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select,.filters .chip{padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:var(--panel);color:var(--text);font-size:.82rem;cursor:pointer}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Cards */
.qcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.qcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.qcard .qtitle{font-weight:600;font-size:.95rem;margin-bottom:6px}
.qcard .qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.72rem}
.badge{padding:2px 9px;border-radius:20px;font-size:.68rem;font-weight:700}
.b-Entry,.b-Beginner{background:#dcfce7;color:#166534}
.b-Junior{background:#dbeafe;color:#1e40af}
.b-Mid,.b-Intermediate{background:#fef3c7;color:#92400e}
.b-Senior,.b-Advanced{background:#fed7aa;color:#9a3412}
.b-Expert{background:#fecaca;color:#991b1b}
[data-theme="dark"] .b-Entry,[data-theme="dark"] .b-Beginner{background:#14532d;color:#86efac}
[data-theme="dark"] .b-Junior{background:#1e3a8a;color:#93c5fd}
[data-theme="dark"] .b-Mid,[data-theme="dark"] .b-Intermediate{background:#78350f;color:#fcd34d}
[data-theme="dark"] .b-Senior,[data-theme="dark"] .b-Advanced{background:#7c2d12;color:#fdba74}
[data-theme="dark"] .b-Expert{background:#7f1d1d;color:#fca5a5}
.tag{padding:2px 8px;border-radius:6px;background:var(--tag-bg);color:var(--tag-text);font-size:.68rem;font-weight:600;cursor:pointer}
.tag:hover{opacity:.8}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.s-done{background:var(--good)}.s-book{background:var(--info)}.s-rev{background:var(--warn)}
mark{background:#fde68a;color:#000;padding:0 2px;border-radius:2px}
/* Detail view */
.detail{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.detail h2{font-size:1.5rem;margin-bottom:12px;line-height:1.3}
.section{margin:18px 0}
.section h3{font-size:.95rem;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;border-bottom:2px solid var(--border);padding-bottom:4px}
.answer-body{font-size:.95rem}
.answer-body p{margin-bottom:10px}
pre{background:var(--code-bg);color:var(--code-text);padding:14px;border-radius:10px;overflow-x:auto;font-size:.82rem;margin:10px 0;font-family:'Consolas','Monaco',monospace}
code.inline{background:var(--tag-bg);color:var(--tag-text);padding:1px 6px;border-radius:4px;font-size:.85em}
.kw{color:#c792ea}.str{color:#c3e88d}.cm{color:#697098}.num{color:#f78c6c}.typ{color:#82aaff}
[data-theme="dark"] .kw{color:#c792ea}
.diagram{background:var(--panel2);border:1px dashed var(--border);border-radius:10px;padding:14px;font-family:monospace;white-space:pre;overflow-x:auto;font-size:.8rem;line-height:1.5}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.related-list a{display:block;padding:8px 12px;background:var(--panel2);border-radius:8px;margin-bottom:6px;font-size:.85rem;border-left:3px solid var(--accent)}
.related-list a:hover{background:var(--tag-bg)}
.detail-nav{display:flex;justify-content:space-between;margin-bottom:14px}
/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.stat-card .num{font-size:2rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{color:var(--muted);font-size:.82rem}
.prog-row{margin-bottom:12px}
.prog-row .top{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px}
.prog-row .bar{height:10px;background:var(--border);border-radius:20px;overflow:hidden}
.prog-row .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px;transition:width .5s}
.badges{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.ach{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;width:150px;text-align:center;opacity:.4;transition:.3s}
.ach.unlocked{opacity:1;border-color:var(--good);box-shadow:0 0 0 2px rgba(16,185,129,.15)}
.ach .ico{font-size:1.8rem}
.ach .t{font-weight:700;font-size:.85rem;margin-top:4px}
.ach .d{font-size:.7rem;color:var(--muted)}
/* Interview mode */
.iv-controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.iv-timer{font-size:1.4rem;font-weight:700;text-align:center;color:var(--accent);margin:10px 0}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--panel);border-radius:14px;padding:24px;max-width:500px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin-bottom:12px}
.modal .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.9rem}
/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:12px 20px;border-radius:10px;z-index:300;box-shadow:var(--shadow);animation:sl .3s}
@keyframes sl{from{transform:translateX(100%);opacity:0}}
/* pager */
.pager{display:flex;gap:8px;justify-content:center;margin:16px 0;align-items:center;flex-wrap:wrap}
.pager button{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.mobile-toggle{display:none}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:66px;background:var(--panel);z-index:90;transform:translateX(-100%);transition:.3s}
  .sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:block}
  .hprogress{display:none}
}
.weak-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.88rem;border:1px solid var(--border);background:var(--panel)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.validation{font-family:monospace;font-size:.82rem;background:var(--panel2);padding:14px;border-radius:10px;line-height:1.7}
.validation .pass{color:var(--good);font-weight:700}

/* ============ Build normalized dataset ============ */
const DIFF_MAP={Entry:'Beginner',Junior:'Junior',Mid:'Intermediate',Senior:'Advanced',Expert:'Expert'};
const QUESTIONS=[];
let idc=0;
for(const topic in RAW){
  const base=RAW[topic];
  const slug=topic.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
  base.q.forEach(row=>{
    const [diff,q,extra=[],hasCode=false]=row;
    idc++;
    const tags=Array.from(new Set([...base.tags,...(extra||[])]));
    QUESTIONS.push({
      id:slug+'-'+String(idc).padStart(4,'0'),
      topic, q, difficulty:diff, displayDiff:DIFF_MAP[diff],
      tags, hasCode
    });
  });
}

/* Compute related questions: shared tags + same topic */
function computeRelated(){
  const tagIndex={};
  QUESTIONS.forEach(qq=>qq.tags.forEach(t=>{(tagIndex[t]=tagIndex[t]||[]).push(qq.id);}));
  const byId={};QUESTIONS.forEach(q=>byId[q.id]=q);
  QUESTIONS.forEach(qq=>{
    const scores={};
    qq.tags.forEach(t=>{
      (tagIndex[t]||[]).forEach(oid=>{
        if(oid===qq.id)return;
        scores[oid]=(scores[oid]||0)+2;
      });
    });
    // topic bonus
    QUESTIONS.filter(o=>o.topic===qq.topic&&o.id!==qq.id).forEach(o=>{scores[o.id]=(scores[o.id]||0)+1;});
    qq.relatedQuestions=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
  });
  return byId;
}
const BY_ID=computeRelated();

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlightCode(code){
  const keywords = new Set(['public','private','protected','class','interface','void','static',
    'async','await','new','return','var','string','int','bool','if','else','for','foreach',
    'while','using','namespace','get','set','readonly','const','virtual','override','abstract',
    'sealed','try','catch','finally','throw','null','true','false','this','base','Task','decimal',
    'byte','struct','enum','SELECT','FROM','WHERE','JOIN','INNER','LEFT','GROUP','ORDER']);

  let out = '';
  let i = 0;
  const n = code.length;

  while(i < n){
    const ch = code[i];

    // Line comment  //...
    if(ch === '/' && code[i+1] === '/'){
      let j = i;
      while(j < n && code[j] !== '\n') j++;
      out += '<span class="cm">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // SQL comment  --...
    if(ch === '-' && code[i+1] === '-'){
      let j = i;
      while(j < n && code[j] !== '\n') j++;
      out += '<span class="cm">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // String literal "..."
    if(ch === '"'){
      let j = i + 1;
      while(j < n && code[j] !== '"') j++;
      j++; // include closing quote
      out += '<span class="str">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // Single-quote string '...'
    if(ch === "'"){
      let j = i + 1;
      while(j < n && code[j] !== "'") j++;
      j++;
      out += '<span class="str">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // Identifier / keyword
    if(/[A-Za-z_]/.test(ch)){
      let j = i;
      while(j < n && /[A-Za-z0-9_]/.test(code[j])) j++;
      const word = code.slice(i, j);
      if(keywords.has(word)){
        out += '<span class="kw">' + esc(word) + '</span>';
      } else {
        out += esc(word);
      }
      i = j;
      continue;
    }
    // Number
    if(/[0-9]/.test(ch)){
      let j = i;
      while(j < n && /[0-9.]/.test(code[j])) j++;
      out += '<span class="num">' + esc(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    // Everything else — escape single char
    out += esc(ch);
    i++;
  }
  return out;
}

function genAnswer(qq){
  const t=qq.topic, q=qq.q;
  let short=`This is a key ${t} interview topic at ${qq.displayDiff} level. `+
    `Understanding "${q.replace(/[?.]+$/,'')}" demonstrates practical command of ${qq.tags.slice(0,3).join(', ')}.`;
  let deep=`<p><strong>What it is:</strong> "${esc(q)}" addresses a core concern in ${t}. `+
    `In interviews, the interviewer wants to see that you not only know the definition but understand the "why", the trade-offs, and how it applies to production systems.</p>`+
    `<p><strong>Why it matters:</strong> ${t} questions like this separate developers who memorise from those who reason about design. Relate your answer to real projects: scalability, maintainability, correctness, and performance.</p>`+
    `<p><strong>How it works / key points:</strong> Break the topic down into (1) the problem it solves, (2) the mechanism, (3) alternatives, and (4) when NOT to use it. This structure impresses senior interviewers.</p>`+
    `<p><strong>When to use / avoid:</strong> Always mention concrete scenarios. State the failure modes and the cost/benefit — that shows engineering maturity.</p>`;
  let real=`<p>Consider a real ${t} scenario on an enterprise .NET system: applying this concept correctly can reduce bugs, improve throughput, or simplify the codebase. Tie the concept to a service you have built — e.g., an ASP.NET Core Web API backed by SQL Server and EF Core, deployed to Azure.</p>`;
  let mistakes=[
    `Giving only a textbook definition without explaining trade-offs.`,
    `Ignoring performance / production implications.`,
    `Not mentioning when the approach should be avoided.`,
    `Failing to connect the concept to related topics like ${qq.tags.slice(0,2).join(' & ')}.`
  ];
  let follow=[
    `Can you describe a production incident where this was relevant?`,
    `What are the alternatives and their trade-offs?`,
    `How does this behave under high concurrency or load?`,
    `How would you test and monitor this in production?`
  ];
  // Code sample per topic family
  let code='';
  const cl=(t+' '+qq.tags.join(' ')).toLowerCase();
  if(cl.includes('linq')){
    code=`// LINQ example: deferred execution & projection\nvar result = customers\n    .Where(c => c.IsActive)          // filter\n    .OrderBy(c => c.Name)\n    .Select(c => new { c.Id, c.Name }) // projection\n    .Take(10);\n// Query executes only when enumerated (deferred execution)\nforeach (var r in result) Console.WriteLine(r.Name);`;
  }else if(cl.includes('sql')||cl.includes('database')){
    code=`-- Indexed lookup + join example\nSELECT o.Id, c.Name, o.Total\nFROM Orders o\nINNER JOIN Customers c ON c.Id = o.CustomerId\nWHERE o.CreatedAt >= '2024-01-01'\nORDER BY o.Total DESC;\n-- Ensure index: CREATE INDEX IX_Orders_CreatedAt ON Orders(CreatedAt) INCLUDE(Total);`;
  }else if(cl.includes('entity framework')||cl.includes('ef core')){
    code=`// EF Core: AsNoTracking for read-only queries (performance)\nvar orders = await db.Orders\n    .AsNoTracking()\n    .Where(o => o.CustomerId == id)\n    .Include(o => o.Items)\n    .ToListAsync();\n// Optimistic concurrency via RowVersion\npublic byte[] RowVersion { get; set; }`;
  }else if(cl.includes('async')||cl.includes('concurrency')||cl.includes('thread')){
    code=`// async/await avoiding deadlocks\npublic async Task<int> GetCountAsync()\n{\n    // ConfigureAwait(false) in library code avoids capturing context\n    var data = await repo.LoadAsync().ConfigureAwait(false);\n    return data.Count;\n}\n// NEVER do: var x = GetCountAsync().Result;  // can deadlock`;
  }else if(cl.includes('dependency injection')){
    code=`// ASP.NET Core DI registration\nbuilder.Services.AddSingleton<IClock, SystemClock>();\nbuilder.Services.AddScoped<IOrderService, OrderService>();   // per-request\nbuilder.Services.AddTransient<IEmailSender, EmailSender>();  // per-resolve\nbuilder.Services.AddDbContext<AppDbContext>();               // scoped\n\n// Constructor injection\npublic OrderController(IOrderService svc) => _svc = svc;`;
  }else if(cl.includes('typescript')){
    code=`// TypeScript generics + narrowing\nfunction firstOrNull<T>(items: T[]): T | null {\n  return items.length ? items[0] : null;\n}\nconst name = user?.profile?.name ?? "Anonymous"; // optional chaining + nullish`;
  }else if(cl.includes('angular')){
    code=`// Angular service + observable\n@Injectable({ providedIn: 'root' })\nexport class DataService {\n  constructor(private http: HttpClient) {}\n  getUsers(): Observable<User[]> {\n    return this.http.get<User[]>('/api/users');\n  }\n}`;
  }else if(cl.includes('redis')||cl.includes('caching')){
    code=`// Cache-aside pattern in C#\nvar cached = await cache.GetStringAsync(key);\nif (cached != null) return JsonSerializer.Deserialize<Product>(cached);\nvar product = await db.Products.FindAsync(id);\nawait cache.SetStringAsync(key, JsonSerializer.Serialize(product),\n    new DistributedCacheEntryOptions { AbsoluteExpirationRelativeToNow = TimeSpan.FromMinutes(5) });\nreturn product;`;
  }else if(cl.includes('microservice')||cl.includes('distributed')){
    code=`// Idempotent message handler (dedup by message id)\npublic async Task Handle(OrderCreated msg)\n{\n    if (await _dedup.SeenAsync(msg.Id)) return; // already processed\n    await _orders.CreateAsync(msg);\n    await _dedup.MarkAsync(msg.Id);\n}`;
  }else if(cl.includes('oop')||cl.includes('design pattern')){
    code=`// Strategy pattern\npublic interface IDiscount { decimal Apply(decimal total); }\npublic class NoDiscount : IDiscount { public decimal Apply(decimal t) => t; }\npublic class TenPercent : IDiscount { public decimal Apply(decimal t) => t * 0.9m; }\n// Inject strategy instead of if/else chains\npublic decimal Checkout(decimal total, IDiscount discount) => discount.Apply(total);`;
  }else if(cl.includes('security')){
    code=`// Parameterized query prevents SQL injection\nusing var cmd = new SqlCommand("SELECT * FROM Users WHERE Email = @e", conn);\ncmd.Parameters.AddWithValue("@e", email);\n// Hash + salt passwords (never store plaintext)\nvar hash = BCrypt.Net.BCrypt.HashPassword(password);`;
  }else if(cl.includes('azure')){
    code=`// Azure Service Bus - send & complete\nvar sender = client.CreateSender("orders");\nawait sender.SendMessageAsync(new ServiceBusMessage(body));\n// Receiver completes message after successful processing\nawait receiver.CompleteMessageAsync(message);`;
  }else if(cl.includes('.net')||cl.includes('c#')){
    code=`// Value vs reference types\nstruct Point { public int X, Y; }   // value type - copied\nclass Node { public int Value; }    // reference type - shared\n\n// IDisposable pattern\npublic void Dispose() { _resource?.Dispose(); GC.SuppressFinalize(this); }`;
  }
  return {short,deep,real,mistakes,follow,code};
}

/* ============ Diagram helper ============ */
function genDiagram(qq){
  const cl=(qq.topic+' '+qq.tags.join(' ')).toLowerCase();
  if(cl.includes('asp.net')||cl.includes('web api')||cl.includes('middleware')){
    return `Client\n  |\n  v\n[ Middleware Pipeline ]\n  |-> Authentication\n  |-> Authorization\n  |-> Routing\n  v\nController --> Service --> Repository --> Database`;
  }
  if(cl.includes('async')||cl.includes('thread')||cl.includes('concurrency')){
    return `Caller ---> await Task ---> ThreadPool\n   |                          |\n   | (returns immediately)     | (runs work)\n   v                          v\ncontinues            completion -> resumes caller`;
  }
  if(cl.includes('load balanc')){
    return `        +--> Server A\nClient -> LB +--> Server B\n        +--> Server C\n(Round-robin / least-connections / IP-affinity)`;
  }
  if(cl.includes('cap')||cl.includes('distributed')||cl.includes('nosql')){
    return `        Consistency\n           /\\\n          /  \\\n   choose 2 of 3\n        /      \\\nAvailability -- Partition Tolerance`;
  }
  if(cl.includes('cache')||cl.includes('redis')){
    return `Request -> [Cache?] --hit--> Return\n              |\n            miss\n              v\n           Database -> store in Cache -> Return`;
  }
  if(cl.includes('index')||cl.includes('sql')){
    return `B-Tree Index\n        [50]\n       /    \\\n    [20]    [80]\n    / \\     /  \\\n  [10][30][70][90]  <- leaf nodes -> data`;
  }
  if(cl.includes('microservice')){
    return `[Client] -> [API Gateway]\n                |\n   +------------+------------+\n   v            v            v\n[Orders]    [Payments]   [Inventory]\n   |            |            |\n  DB           DB           DB`;
  }
  return '';
}

/* ============ State / Storage ============ */
const LS_KEY='dotnet-mastery-v1';
let STATE={completed:{},bookmarked:{},revision:{},notes:{},lastQuestion:null,lastCategory:'__all',theme:'light',streak:0,lastStudyDate:null,sessions:0,interviewResults:{}};
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s)STATE=Object.assign(STATE,s);}catch(e){}}
function saveState(){localStorage.setItem(LS_KEY,JSON.stringify(STATE));}
loadState();

function updateStreak(){
  const today=new Date().toDateString();
  if(STATE.lastStudyDate!==today){
    const y=new Date(Date.now()-864e5).toDateString();
    STATE.streak=(STATE.lastStudyDate===y)?STATE.streak+1:1;
    STATE.lastStudyDate=today;STATE.sessions++;saveState();
  }
}
updateStreak();

function setActiveNav(view,cat){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(view){const el=document.querySelector('.nav-item[data-view="'+view+'"]');if(el)el.classList.add('active');}

document.querySelectorAll('.nav-item[data-view]').forEach(el=>{

function getSearchTokens(searchText) {
  return [...new Set(
    searchText
      .trim()
      .toLowerCase()
      .split(/\s+/)
      .map(word => word.replace(/^[,;:!?()[$${}'"]+|[,;:!?()[$${}'"]+$/g, ''))
      .filter(Boolean)
  )];
}

function getSearchableText(q) {
  const ans = BY_ID[q.id].__ans || (BY_ID[q.id].__ans = genAnswer(q));

  return [
    q.q,
    q.topic,
    q.difficulty,
    q.displayDiff,
    q.tags.join(' '),
    ans.short,
    ans.deep,
    ans.real,
    ans.mistakes.join(' '),
    ans.follow.join(' ')
  ]
    .join(' ')
    .toLowerCase();
}
/* Filtering questions */
function getFiltered(){
  let list=QUESTIONS.slice();
  if(VIEW.cat&&VIEW.cat!=='__all')list=list.filter(q=>q.topic===VIEW.cat);
  const f=VIEW.filters;
  if(f.tag)list=list.filter(q=>q.tags.includes(f.tag));
  if(f.difficulty)list=list.filter(q=>q.displayDiff===f.difficulty);
  if(f.status==='completed')list=list.filter(q=>STATE.completed[q.id]);
  if(f.status==='notcompleted')list=list.filter(q=>!STATE.completed[q.id]);
  if(f.status==='bookmarked')list=list.filter(q=>STATE.bookmarked[q.id]);
  if(f.status==='revision')list=list.filter(q=>STATE.revision[q.id]);
  const searchTokens = getSearchTokens(VIEW.search);
	if (searchTokens.length) {
	list = list.filter(q => {
		const searchableText = getSearchableText(q);
			// AND search: every keyword entered must exist in the result.
		return searchTokens.some(keyword => searchableText.includes(keyword));
		});
	}
  return list;
}

function statusDots(q){
  let h='';
  if(STATE.completed[q.id])h+='<span class="status-dot s-done" title="Completed"></span>';
  if(STATE.bookmarked[q.id])h+='<span class="status-dot s-book" title="Bookmarked"></span>';
  if(STATE.revision[q.id])h+='<span class="status-dot s-rev" title="Needs revision"></span>';
  return h;
}
function escapeRegExp(value) {
  const special = '.*+?^${}()|[]\\';
  let out = '';

  for (const ch of String(value)) {
    if (special.indexOf(ch) !== -1) {
      out += '\\';
    }
    out += ch;
  }

  return out;
}

function hl(text) {
  const tokens = getSearchTokens(VIEW.search);

  if (!tokens.length) {
    return esc(text);
  }

  const pattern = new RegExp('(' + tokens.map(escapeRegExp).join('|') + ')', 'gi');

  return esc(text).replace(pattern, '<mark>$1</mark>');
}

function qCardHtml(q){
  return `<div class="qcard" data-id="${q.id}">
    <div class="qtitle">${q.hasCode?'💻 ':''}${hl(q.q)}</div>
    <div class="qmeta">
      <span class="badge b-${q.displayDiff}">${q.displayDiff}</span>
      ${q.tags.slice(0,4).map(t=>`<span class="tag" data-tag="${esc(t)}">${esc(t)}</span>`).join('')}
      <span style="margin-left:auto">${statusDots(q)}</span>
    </div></div>`;
}

/* ============ Renders ============ */
function render(){
  updateHeaderProgress();
  if(VIEW.type==='dashboard')renderDashboard();
  else if(VIEW.type==='questions')renderQuestions();
  else if(VIEW.type==='detail')renderDetail(VIEW.currentId);
  else if(VIEW.type==='continue')renderContinue();
  else if(VIEW.type==='interview')renderInterview();
  else if(VIEW.type==='weak')renderWeak();
  else if(VIEW.type==='validation')renderValidation();
}

function renderQuestions(){
  const list=getFiltered();
  const total=list.length,pages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(VIEW.page>pages)VIEW.page=pages;
  const slice=list.slice((VIEW.page-1)*PER_PAGE,VIEW.page*PER_PAGE);
  const title=VIEW.cat==='__all'?'All Questions':VIEW.cat;
  main.innerHTML=`
   <h2 style="margin-bottom:12px">${esc(title)} <span style="color:var(--muted);font-size:.9rem">(${total} questions)</span></h2>
   <div class="filters">
     <select id="fDiff"><option value="">All Difficulty</option>${['Beginner','Junior','Intermediate','Advanced','Expert'].map(d=>`<option ${VIEW.filters.difficulty===d?'selected':''}>${d}</option>`).join('')}</select>
     <select id="fStatus">
       <option value="">All Status</option>
       <option value="completed" ${VIEW.filters.status==='completed'?'selected':''}>Completed</option>
       <option value="notcompleted" ${VIEW.filters.status==='notcompleted'?'selected':''}>Not Completed</option>
       <option value="bookmarked" ${VIEW.filters.status==='bookmarked'?'selected':''}>Bookmarked</option>
       <option value="revision" ${VIEW.filters.status==='revision'?'selected':''}>Needs Revision</option>
     </select>
     ${VIEW.filters.tag?`<span class="chip active" id="clearTag">Tag: ${esc(VIEW.filters.tag)} ✕</span>`:''}
   </div>
   <div id="qlist">${slice.map(qCardHtml).join('')||'<p style="color:var(--muted)">No questions match your filters.</p>'}</div>
   <div class="pager">
     <button ${VIEW.page<=1?'disabled':''} id="prevP">← Prev</button>
     <span>Page ${VIEW.page} / ${pages}</span>
     <button ${VIEW.page>=pages?'disabled':''} id="nextP">Next →</button>
   </div>`;
  document.getElementById('fDiff').onchange=e=>{VIEW.filters.difficulty=e.target.value;VIEW.page=1;render();};
  document.getElementById('fStatus').onchange=e=>{VIEW.filters.status=e.target.value;VIEW.page=1;render();};
  const ct=document.getElementById('clearTag');if(ct)ct.onclick=()=>{VIEW.filters.tag='';render();};
  const pp=document.getElementById('prevP'),np=document.getElementById('nextP');
  if(pp)pp.onclick=()=>{VIEW.page--;render();window.scrollTo(0,0);};
  if(np)np.onclick=()=>{VIEW.page++;render();window.scrollTo(0,0);};
  bindCards();
}
function bindCards(){
  main.querySelectorAll('.qcard').forEach(c=>{
    c.onclick=e=>{
      if(e.target.classList.contains('tag')){VIEW.filters.tag=e.target.dataset.tag;VIEW.type='questions';VIEW.page=1;render();return;}
      openDetail(c.dataset.id);
    };
  });
}

     <div class="prog-row"><div class="top"><b>Overall Progress</b><span>${pct}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>
   </div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px">
     <div class="stat-card"><h3 style="margin-bottom:12px">By Difficulty</h3>
       ${Object.entries(diffs).map(([d,v])=>{const p=v.t?Math.round(v.c/v.t*100):0;return `<div class="prog-row"><div class="top"><span>${d}</span><span>${v.c}/${v.t}</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`;}).join('')}
     </div>
     <div class="stat-card"><h3 style="margin-bottom:12px">Recent Activity</h3>
       ${recent.length?recent.map(r=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:.85rem;cursor:pointer" class="recent-item" data-id="${r.id}">✅ [${esc(r.topic)}] ${esc(r.q.slice(0,50))}...</div>`).join(''):'<span style="color:var(--muted)">Complete questions to see activity</span>'}
     </div>
   </div>
   <div class="stat-card" style="margin-top:16px"><h3 style="margin-bottom:12px">Completion by Technology</h3>
     ${Object.entries(topics).sort((a,b)=>b[1].t-a[1].t).map(([t,v])=>{const p=v.t?Math.round(v.c/v.t*100):0;return `<div class="prog-row"><div class="top"><span class="topic-link" data-cat="${esc(t)}" style="cursor:pointer;color:var(--accent)">${esc(t)}</span><span>${v.c}/${v.t} (${p}%)</span></div><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`;}).join('')}
   </div>
   <h3 style="margin:24px 0 12px">🏆 Achievements</h3>
   <div class="badges" id="achArea"></div>`;
  main.querySelectorAll('.recent-item').forEach(el=>el.onclick=()=>openDetail(el.dataset.id));
  main.querySelectorAll('.topic-link').forEach(el=>el.onclick=()=>{VIEW={type:'questions',cat:el.dataset.cat,page:1,filters:{difficulty:'',status:'',tag:''},search:VIEW.search};render();});
  renderAchievements();
}

const ACHIEVEMENTS=[
  {id:'first',ico:'🎯',t:'First Step',d:'Complete first question',test:()=>completedCount()>=1},
  {id:'cs25',ico:'⚡',t:'C# Explorer',d:'Complete 25 C# questions',test:()=>QUESTIONS.filter(q=>q.topic==='C#'&&STATE.completed[q.id]).length>=25},
  {id:'sql50',ico:'🗄️',t:'SQL Warrior',d:'Complete 50 SQL questions',test:()=>QUESTIONS.filter(q=>(q.topic==='SQL Server'||q.topic==='Databases')&&STATE.completed[q.id]).length>=50},
  {id:'sd25',ico:'🏛️',t:'System Designer',d:'Complete 25 System Design',test:()=>QUESTIONS.filter(q=>q.topic==='System Design'&&STATE.completed[q.id]).length>=25},
  {id:'50',ico:'🔟',t:'Half Century',d:'Complete 50 questions',test:()=>completedCount()>=50},
  {id:'200',ico:'💪',t:'Grinder',d:'Complete 200 questions',test:()=>completedCount()>=200},
  {id:'streak7',ico:'🔥',t:'On Fire',d:'7-day streak',test:()=>STATE.streak>=7},
  {id:'ready',ico:'🏆',t:'Interview Ready',d:'Complete 90% of all',test:()=>completedCount()/QUESTIONS.length>=0.9}
];
function renderAchievements(){
  const area=document.getElementById('achArea');if(!area)return;
  area.innerHTML=ACHIEVEMENTS.map(a=>`<div class="ach ${a.test()?'unlocked':''}"><div class="ico">${a.ico}</div><div class="t">${a.t}</div><div class="d">${a.d}</div></div>`).join('');
}
let unlockedSet=new Set(ACHIEVEMENTS.filter(a=>a.test()).map(a=>a.id));
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{if(a.test()&&!unlockedSet.has(a.id)){unlockedSet.add(a.id);toast('🏆 Achievement: '+a.t);}});
}

function renderContinue(){
  const last=STATE.lastQuestion?BY_ID[STATE.lastQuestion]:null;
  const nextUnc=QUESTIONS.find(q=>!STATE.completed[q.id]);
  main.innerHTML=`<h2 style="margin-bottom:16px">▶ Continue Learning</h2>
    <div class="dash-grid">
      <div class="stat-card"><div class="lbl">Continue where you left off</div>
        ${last?`<div style="margin:10px 0;font-weight:600">${esc(last.q)}</div><span class="badge b-${last.displayDiff}">${last.displayDiff}</span><br><button class="btn primary" style="margin-top:10px" id="cLast">Continue →</button>`:'<p style="color:var(--muted)">No history yet</p>'}
      </div>
      <div class="stat-card"><div class="lbl">Next Uncompleted</div>
        ${nextUnc?`<div style="margin:10px 0;font-weight:600">${esc(nextUnc.q)}</div><button class="btn primary" style="margin-top:10px" id="cNext">Start →</button>`:'<p>All done! 🏆</p>'}
      </div>
      <div class="stat-card"><div class="lbl">Random Practice</div>
        <p style="margin:10px 0;color:var(--muted)">Test yourself with a random question</p>
        <button class="btn primary" id="cRand">🎲 Random Question</button>
      </div>
      <div class="stat-card"><div class="lbl">Practice Weak Areas</div>
        <p style="margin:10px 0;color:var(--muted)">Focus on topics with low completion</p>
        <button class="btn primary" id="cWeak">⚠ Practice Weak Areas</button>
      </div>
    </div>`;
  if(last)document.getElementById('cLast').onclick=()=>openDetail(last.id);
  if(nextUnc)document.getElementById('cNext').onclick=()=>openDetail(nextUnc.id);
  document.getElementById('cRand').onclick=()=>openDetail(QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)].id);
  document.getElementById('cWeak').onclick=()=>{setActiveNav('weak');VIEW.type='weak';render();};
}

function weakAreas(){
  const topics={};QUESTIONS.forEach(q=>{topics[q.topic]=topics[q.topic]||{t:0,c:0,rev:0};topics[q.topic].t++;if(STATE.completed[q.id])topics[q.topic].c++;if(STATE.revision[q.id])topics[q.topic].rev++;});
  return Object.entries(topics).map(([t,v])=>({topic:t,pct:v.t?Math.round(v.c/v.t*100):0,rev:v.rev,total:v.t,done:v.c})).sort((a,b)=>a.pct-b.pct);
}
function renderWeak(){
  const wa=weakAreas().filter(w=>w.pct<100).slice(0,12);
  main.innerHTML=`<h2 style="margin-bottom:16px">⚠ My Weak Areas</h2>
   <p style="color:var(--muted);margin-bottom:14px">Ranked by lowest completion. Focus your practice here.</p>
   ${wa.map(w=>`<div class="weak-item">
      <div><b>${esc(w.topic)}</b><br><span style="font-size:.8rem;color:var(--muted)">Completion: ${w.pct}% · ${w.done}/${w.total} · ${w.rev} for revision</span>
      <div class="bar" style="height:8px;margin-top:6px;background:var(--border);border-radius:20px;overflow:hidden"><div style="width:${w.pct}%;height:100%;background:linear-gradient(90deg,var(--warn),var(--bad))"></div></div></div>
      <button class="btn sm primary weak-btn" data-cat="${esc(w.topic)}">Practice</button>
   </div>`).join('')||'<p>All topics complete! 🏆</p>'}`;
  main.querySelectorAll('.weak-btn').forEach(b=>b.onclick=()=>{
    const nq=QUESTIONS.find(q=>q.topic===b.dataset.cat&&!STATE.completed[q.id]);
    if(nq)openDetail(nq.id);else{VIEW={type:'questions',cat:b.dataset.cat,page:1,filters:{difficulty:'',status:'',tag:''},search:''};render();}
  });
}

/* Interview Mode */
let ivState={q:null,shown:false,timer:0,int:null};
function renderInterview(){
  main.innerHTML=`<h2 style="margin-bottom:16px">🎯 Interview Mode</h2>
   <div class="filters">
     <select id="ivTopic"><option value="">Any Topic</option>${Object.keys(RAW).sort().map(t=>`<option>${esc(t)}</option>`).join('')}</select>
     <select id="ivDiff"><option value="">Any Difficulty</option>${['Beginner','Junior','Intermediate','Advanced','Expert'].map(d=>`<option>${d}</option>`).join('')}</select>
     <button class="btn primary" id="ivStart">Start / Next Question</button>
   </div>
   <div id="ivArea"><p style="color:var(--muted)">Select filters and click Start. The question shows first — try to answer, then reveal.</p></div>`;
  document.getElementById('ivStart').onclick=ivNext;
}
function ivNext(){
  const t=document.getElementById('ivTopic').value,d=document.getElementById('ivDiff').value;
  let pool=QUESTIONS.filter(q=>(!t||q.topic===t)&&(!d||q.displayDiff===d));
  if(!pool.length){document.getElementById('ivArea').innerHTML='<p>No matching questions.</p>';return;}
  ivState.q=pool[Math.floor(Math.random()*pool.length)];ivState.shown=false;ivState.timer=0;
  if(ivState.int)clearInterval(ivState.int);
  ivState.int=setInterval(()=>{ivState.timer++;const el=document.getElementById('ivTimer');if(el)el.textContent=fmtTime(ivState.timer);},1000);
  drawIv();
}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function drawIv(){
  const q=ivState.q,ans=q.__ans||(q.__ans=genAnswer(q));
  document.getElementById('ivArea').innerHTML=`
   <div class="detail">
     <div class="qmeta" style="margin-bottom:8px"><span class="badge b-${q.displayDiff}">${q.displayDiff}</span><span class="tag">${esc(q.topic)}</span></div>
     <h2>${esc(q.q)}</h2>
     <div class="iv-timer" id="ivTimer">${fmtTime(ivState.timer)}</div>
     ${ivState.shown?`
        <div class="section"><h3>Answer</h3><div class="answer-body"><p>${ans.short}</p>${ans.deep}</div>
        ${ans.code?`<pre>${highlightCode(ans.code)}</pre>`:''}</div>
        <p style="text-align:center;margin:12px 0;font-weight:600">How did you do?</p>
        <div class="iv-controls">
          <button class="btn primary" id="ivKnew">✅ I knew it</button>
          <button class="btn" id="ivPartial">🟡 Partially</button>
          <button class="btn" id="ivFail">❌ Didn't know</button>
          <button class="btn" id="ivFull">Open Full Detail</button>
        </div>`:`
        <div class="iv-controls"><button class="btn primary" id="ivShow">Show Answer</button></div>`}
   </div>`;
  if(!ivState.shown){document.getElementById('ivShow').onclick=()=>{ivState.shown=true;drawIv();};}
  else{
    const record=(r)=>{STATE.interviewResults[ivState.q.id]=r;if(r==='knew')STATE.completed[ivState.q.id]=Date.now();if(r==='fail')STATE.revision[ivState.q.id]=Date.now();saveState();updateStreak();checkAchievements();ivNext();};
    document.getElementById('ivKnew').onclick=()=>record('knew');
    document.getElementById('ivPartial').onclick=()=>record('partial');
    document.getElementById('ivFail').onclick=()=>record('fail');
    document.getElementById('ivFull').onclick=()=>{if(ivState.int)clearInterval(ivState.int);openDetail(ivState.q.id);};
  }
}

/* Validation */
function renderValidation(){
  const ids=new Set(),dupes=[];let noQ=0,noAns=0,broken=0;
  QUESTIONS.forEach(q=>{if(ids.has(q.id))dupes.push(q.id);ids.add(q.id);if(!q.q)noQ++;const a=genAnswer(q);if(!a.short)noAns++;q.relatedQuestions.forEach(r=>{if(!BY_ID[r])broken++;});});
  const validDiff=QUESTIONS.every(q=>['Beginner','Junior','Intermediate','Advanced','Expert'].includes(q.displayDiff));
  const pass=dupes.length===0&&noQ===0&&noAns===0&&broken===0&&validDiff;
  const byTopic={};QUESTIONS.forEach(q=>byTopic[q.topic]=(byTopic[q.topic]||0)+1);
  const byDiff={};QUESTIONS.forEach(q=>byDiff[q.displayDiff]=(byDiff[q.displayDiff]||0)+1);
  main.innerHTML=`<h2 style="margin-bottom:16px">🔧 Dataset Validation</h2>
   <div class="validation">
Dataset validation: <span class="${pass?'pass':''}">${pass?'PASS ✅':'FAIL ❌'}</span>

Total Questions:        ${QUESTIONS.length}
Unique IDs:             ${ids.size}
Duplicate IDs:          ${dupes.length}
Questions missing title:${noQ}
Questions missing answer:${noAns}
Broken related refs:    ${broken}
Valid difficulties:     ${validDiff?'YES':'NO'}
Questions completed:    ${completedCount()}
Questions remaining:    ${QUESTIONS.length-completedCount()}
   </div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
     <div class="stat-card"><h3 style="margin-bottom:10px">By Technology</h3><div class="validation" style="background:none;padding:0">${Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).map(([t,c])=>esc(t)+': '+c).join('\n')}</div></div>
     <div class="stat-card"><h3 style="margin-bottom:10px">By Difficulty</h3><div class="validation" style="background:none;padding:0">${['Beginner','Junior','Intermediate','Advanced','Expert'].map(d=>d+': '+(byDiff[d]||0)).join('\n')}</div></div>
   </div>`;
}

/* ============ Search ============ */
let searchTimer;
document.getElementById('searchInput').oninput=e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{VIEW.search=e.target.value;VIEW.type='questions';if(VIEW.cat===undefined)VIEW.cat='__all';VIEW.page=1;setActiveNav('questions');render();},250);
};

/* ============ Theme ============ */
function applyTheme(){document.body.setAttribute('data-theme',STATE.theme);document.getElementById('themeBtn').textContent=STATE.theme==='dark'?'☀️':'🌙';}
document.getElementById('themeBtn').onclick=()=>{STATE.theme=STATE.theme==='dark'?'light':'dark';saveState();applyTheme();};
applyTheme();

/* ============ Export / Import ============ */
document.getElementById('exportBtn').onclick=()=>{
  const data={version:1,exportedAt:new Date().toISOString(),
    completedQuestions:Object.keys(STATE.completed),bookmarkedQuestions:Object.keys(STATE.bookmarked),
    revisionQuestions:Object.keys(STATE.revision),notes:STATE.notes,lastQuestion:STATE.lastQuestion,
    theme:STATE.theme,streak:STATE.streak,sessions:STATE.sessions,interviewResults:STATE.interviewResults};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dotnet-mastery-progress.json';a.click();
  toast('Progress exported ⬇');
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.version||!Array.isArray(data.completedQuestions))throw 'Invalid file format';
      showImportModal(data);
    }catch(err){toast('Import failed: invalid file');}
    e.target.value='';
  };
  reader.readAsText(file);
};
function showImportModal(data){
  const cur=completedCount(),imp=data.completedQuestions.length;
  document.getElementById('modalArea').innerHTML=`
   <div class="modal-bg"><div class="modal">
     <h3>Import Progress</h3>
     <div class="row"><span>Current progress:</span><b>${cur} completed</b></div>
     <div class="row"><span>Imported progress:</span><b>${imp} completed</b></div>
     <p style="margin:14px 0;color:var(--muted);font-size:.85rem">Choose how to apply the imported data.</p>
     <div style="display:flex;gap:8px;justify-content:flex-end">
       <button class="btn" id="mCancel">Cancel</button>
       <button class="btn" id="mMerge">Merge</button>
       <button class="btn primary" id="mReplace">Replace</button>
     </div>
   </div></div>`;
  const arr2obj=a=>{const o={};(a||[]).forEach(id=>o[id]=Date.now());return o;};
  const close=()=>document.getElementById('modalArea').innerHTML='';
  document.getElementById('mCancel').onclick=close;
  document.getElementById('mReplace').onclick=()=>{
    STATE.completed=arr2obj(data.completedQuestions);STATE.bookmarked=arr2obj(data.bookmarkedQuestions);
    STATE.revision=arr2obj(data.revisionQuestions);STATE.notes=data.notes||{};STATE.lastQuestion=data.lastQuestion||null;
    STATE.theme=data.theme||STATE.theme;STATE.streak=data.streak||0;STATE.interviewResults=data.interviewResults||{};
    saveState();applyTheme();close();render();toast('Progress replaced ✅');
  };
  document.getElementById('mMerge').onclick=()=>{
    Object.assign(STATE.completed,arr2obj(data.completedQuestions));
    Object.assign(STATE.bookmarked,arr2obj(data.bookmarkedQuestions));
    Object.assign(STATE.revision,arr2obj(data.revisionQuestions));
    Object.assign(STATE.notes,data.notes||{});STATE.interviewResults=Object.assign(STATE.interviewResults,data.interviewResults||{});
    STATE.streak=Math.max(STATE.streak,data.streak||0);
    saveState();close();render();toast('Progress merged ✅');
  };
}

/* Mobile sidebar */
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');}
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

/* ============ Init ============ */
buildTopicNav();
render();
console.log('Loaded',QUESTIONS.length,'questions across',Object.keys(RAW).length,'topics');
</script>
</body>
</html>
